[package]
name = "easy-sandbox"
version = "0.1.0"
edition = "2024"
description = "A deliberately small Linux process sandbox for agent workloads"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = { version = "=0.5.0", default-features = false }
